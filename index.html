<!DOCTYPE html>
<!--
  App Formazione — v0.1 (03/09/2026)

  Serve a decidere CHI SCHIERARE ogni giornata. E' la seconda meta' dell'app asta:
  quella compra, questa manda in campo.

  Il commento sta DOPO il DOCTYPE, non prima: un commento prima manda il browser in
  quirks mode.

  CHANGELOG
  v0.1  Prima versione. Import rosa dall'app asta (schema 1) o composizione a mano.
        Motore certezza/resa, campo, ottimizzatore di modulo con simulazione, panchina
        ordinata. Dati di giornata da dati/probabili.json, con inserimento manuale come
        rete di sicurezza.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<meta name="description" content="Assistente di formazione: probabili, moduli, modificatore di difesa.">
<link rel="manifest" href="./manifest.webmanifest">
<title>Formazione — Paradiso della Brugola</title>
<style>
  :root{
    /* Stessi token dell'app asta: due app della stessa stagione devono sembrare la stessa cosa. */
    --bg:#0E1116; --bg-2:#12161C;
    --surface:#181D25; --surface2:#212832; --surface3:#2A313D;
    --text:#EEF1F5; --text-dim:#C3CAD6; --muted:#7F8899;
    --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.14);
    --accent:#F0BC46; --accent-dark:#B98A22; --accent-soft:rgba(240,188,70,.13);
    --pos:#43C98A; --neg:#F0635F; --other:#D4B584;
    /* Colori di ruolo: NON si toccano. Sono gia' il codice con cui si legge l'altra app. */
    --role-p:#E8B339; --role-d:#4CAF7D; --role-c:#5B8DEF; --role-a:#E15B5B;
    --role-p-soft:rgba(232,179,57,.14); --role-d-soft:rgba(76,175,125,.14);
    --role-c-soft:rgba(91,141,239,.14); --role-a-soft:rgba(225,91,91,.14);
    --radius:14px; --radius-sm:10px; --radius-xs:7px;
    --lift: inset 0 1px 0 rgba(255,255,255,.055), 0 1px 2px rgba(0,0,0,.4);
    --lift-2: inset 0 1px 0 rgba(255,255,255,.07), 0 4px 16px rgba(0,0,0,.5);
    --glass: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
    --pitch:#16321F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;}
  html{ height:100dvh; }
  body{ min-height:100dvh; background:
      radial-gradient(1100px 420px at 50% -14%, rgba(76,175,125,.10), transparent 70%),
      radial-gradient(760px 320px at 90% 0%, rgba(240,188,70,.05), transparent 70%),
      var(--bg); background-attachment:fixed;
      display:flex; flex-direction:column; overscroll-behavior:none; }
  button, .tap{ font-family:inherit; user-select:none; -webkit-user-select:none; cursor:pointer; }

  /* Cifre tabulari ovunque compaia un numero: i valori si ricalcolano di continuo e senza
     questo le colonne ballano a ogni ridisegno. */
  .status-strip, .prow .nums, .slot .fm, .slot .cz, .mod-row .n, .bench-row .nums,
  .info-cell .v, .mv-box, .kpi .v, .modulo-row .pts, .pct-badge{ font-variant-numeric:tabular-nums; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* ---------- Shell ---------- */
  #app{ display:flex; flex-direction:column; height:100%; height:100dvh; }
  header{ position:sticky; top:0; z-index:20; background:var(--bg-2); border-bottom:1px solid var(--line); }
  main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 0 40px; }

  .status-strip{ display:flex; align-items:center; gap:10px; padding:8px 12px 6px;
    font-size:12px; color:var(--text-dim); }
  .status-strip .gg{ font-weight:700; color:var(--text); font-size:13px; }
  .status-strip .eta{ color:var(--muted); }
  .status-strip .sp{ flex:1; }
  .icon-btn{ background:var(--surface2); border:1px solid var(--line); color:var(--text-dim);
    border-radius:var(--radius-xs); padding:5px 9px; font-size:12px;
    position:relative; min-width:40px; min-height:36px; }
  .icon-btn:active{ background:var(--surface3); }
  /* Bersagli da dito. I comandi in testata restano visivamente piccoli per non rubare spazio
     verticale, ma l area toccabile viene estesa oltre il bordo visibile con uno pseudo-elemento:
     il dito trova i suoi ~44px, la testata non cresce di un pixel. L estensione orizzontale e
     tenuta sotto al gap fra i pulsanti (10px) cosi le aree non si sovrappongono. */
  .icon-btn::after{ content:""; position:absolute; inset:-8px -2px; }

  .tabs{ display:flex; gap:6px; padding:2px 10px 9px; }
  .tab{ flex:1; background:var(--surface); border:1px solid var(--line); color:var(--text-dim);
    border-radius:var(--radius-sm); padding:9px 4px; font-size:13px; font-weight:600;
    background-image:var(--glass); transition:all .13s var(--ease); }
  .tab.on{ background:var(--accent-soft); border-color:var(--accent-dark); color:var(--accent); }
  .tab{ position:relative; }
  /* Solo in verticale: in orizzontale i tab sono gia larghi e si sfiorerebbero fra loro. */
  .tab::after{ content:""; position:absolute; inset:-5px 0; }

  .warnbar{ background:rgba(240,99,95,.14); border-top:1px solid rgba(240,99,95,.3);
    border-bottom:1px solid rgba(240,99,95,.3); color:#FFC9C7; font-size:12px;
    padding:7px 12px; text-align:center; }
  .warnbar.info{ background:rgba(240,188,70,.12); border-color:rgba(240,188,70,.3); color:#F2D89A; }

  /* ---------- Campo ---------- */
  .pitch{ margin:0 10px 14px; border-radius:var(--radius); border:1px solid var(--line);
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.022) 0 34px, transparent 34px 68px),
      linear-gradient(180deg, #1A3A24, #142C1C);
    padding:14px 8px 12px; box-shadow:var(--lift-2); }
  .pitch-line{ display:flex; justify-content:center; gap:7px; margin-bottom:9px; }
  .pitch-line:last-child{ margin-bottom:0; }

  /* Larghezza elastica invece che fissa: con la difesa a 5 i riquadri da 78px non ci
     stavano in 355px e la linea andava a capo 4+1, che su una difesa non si puo vedere.
     Cosi le caselle si dividono lo spazio e la riga resta una riga sempre. */
  .slot{ flex:1 1 0; min-width:0; max-width:84px; background:var(--surface); border:1px solid var(--line-2);
    border-radius:var(--radius-sm); padding:6px 4px 5px; text-align:center;
    box-shadow:var(--lift); position:relative; overflow:hidden; }
  .slot:active{ background:var(--surface2); }
  .slot::before{ content:''; position:absolute; inset:0 0 auto 0; height:3px; }
  .slot.P::before{ background:var(--role-p); } .slot.D::before{ background:var(--role-d); }
  .slot.C::before{ background:var(--role-c); } .slot.A::before{ background:var(--role-a); }
  .slot .nm{ font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; margin-top:2px; }
  .slot .sq{ font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slot .fm{ font-size:12.5px; font-weight:700; margin-top:2px; }
  .slot .cz{ font-size:9.5px; color:var(--muted); }
  .slot.vuoto{ background:rgba(0,0,0,.25); border-style:dashed; color:var(--muted); }
  .slot.vuoto .nm{ color:var(--muted); font-weight:500; }
  .slot.rischio{ border-color:rgba(240,99,95,.5); }
  .slot.bloccato::after{ content:'📌'; position:absolute; top:3px; right:3px; font-size:8px; }

  .cz-bar{ height:3px; border-radius:99px; background:rgba(255,255,255,.12); margin:3px 2px 0;
    overflow:hidden; }
  .cz-bar i{ display:block; height:100%; background:var(--pos); }
  .cz-bar.mid i{ background:var(--accent); } .cz-bar.low i{ background:var(--neg); }

  /* ---------- KPI ---------- */
  .kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:0 10px 12px; }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:8px 9px; background-image:var(--glass); }
  .kpi .k{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .kpi .v{ font-size:17px; font-weight:700; margin-top:1px; }
  .kpi .s{ font-size:10.5px; color:var(--text-dim); }
  .v.forte{ color:var(--pos); } .v.ok{ color:var(--accent); } .v.debole{ color:var(--neg); }

  .sec-title{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;
    margin:16px 10px 7px; display:flex; align-items:center; gap:8px; }
  .sec-title::after{ content:''; flex:1; height:1px; background:var(--line); }

  /* ---------- Righe giocatore ---------- */
  .prow{ display:grid; grid-template-columns:4px minmax(0,1fr) auto auto; align-items:center;
    column-gap:10px; padding:11px 13px; margin:0 10px 6px; border-radius:var(--radius);
    background:var(--surface); border:1px solid var(--line);
    transition:background .13s var(--ease), border-color .13s var(--ease); }
  .prow:active{ background:var(--surface2); border-color:var(--line-2); }
  .rolebar{ width:4px; height:26px; border-radius:99px; }
  .rolebar.P{ background:var(--role-p); } .rolebar.D{ background:var(--role-d); }
  .rolebar.C{ background:var(--role-c); } .rolebar.A{ background:var(--role-a); }
  .prow .main{ min-width:0; }
  .prow .nm{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prow .sub{ font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; margin-top:1px; }
  .prow .nums{ text-align:right; }
  .prow .nums .fm{ font-size:15px; font-weight:700; }
  .prow .nums .cz{ font-size:10.5px; color:var(--muted); }
  .prow.fuori{ opacity:.5; }

  .pct-badge{ font-size:11px; font-weight:700; padding:3px 7px; border-radius:99px;
    border:1px solid transparent; white-space:nowrap; }
  .pct-badge.alta{ background:rgba(67,201,138,.14); color:var(--pos); border-color:rgba(67,201,138,.3); }
  .pct-badge.media{ background:var(--accent-soft); color:var(--accent); border-color:rgba(240,188,70,.3); }
  .pct-badge.bassa{ background:rgba(240,99,95,.13); color:var(--neg); border-color:rgba(240,99,95,.3); }
  .pct-badge.out{ background:rgba(127,136,153,.14); color:var(--muted); border-color:var(--line-2); }

  .flag{ font-size:10px; padding:2px 6px; border-radius:var(--radius-xs); margin-left:5px;
    white-space:nowrap; }
  .flag.inf{ background:rgba(240,99,95,.15); color:#F5928F; }
  .flag.sq{ background:rgba(225,91,91,.22); color:#FFB3B1; }
  .flag.dub{ background:var(--accent-soft); color:var(--accent); }
  .flag.man{ background:rgba(91,141,239,.16); color:#9BBBF5; }

  /* ---------- Moduli ---------- */
  .modulo-row{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center;
    column-gap:11px; padding:12px 13px; margin:0 10px 6px; border-radius:var(--radius);
    background:var(--surface); border:1px solid var(--line); }
  .modulo-row.on{ border-color:var(--accent-dark); background:var(--accent-soft); }
  .modulo-row .mn{ font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .modulo-row .diff{ font-size:11px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .modulo-row .pts{ font-size:16px; font-weight:700; text-align:right; }
  .modulo-row .pts small{ display:block; font-size:10px; color:var(--muted); font-weight:500; }
  .rank{ width:22px; height:22px; border-radius:99px; background:var(--surface3); color:var(--text-dim);
    font-size:11px; font-weight:700; display:grid; place-items:center; }
  .modulo-row.on .rank{ background:var(--accent); color:#1a1200; }

  /* ---------- Sheet ---------- */
  #overlay{ position:fixed; inset:0; background:rgba(4,6,9,.74); display:none; z-index:40;
    animation:fadeIn .18s var(--ease); }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes sheetUp{ from{transform:translateY(14px); opacity:.6} to{transform:none; opacity:1} }
  .sheet{ position:fixed; left:0; right:0; bottom:0;
    background:linear-gradient(180deg, var(--surface2) 0, var(--surface) 90px);
    border-top:1px solid var(--line-2); border-radius:22px 22px 0 0; z-index:41; display:none;
    max-height:88vh; max-height:88dvh; overflow-y:auto;
    padding:6px 16px calc(24px + env(safe-area-inset-bottom));
    overscroll-behavior:contain; box-shadow:0 -18px 50px rgba(0,0,0,.6);
    animation:sheetUp .24s var(--ease); }
  .handle{ width:40px; height:4px; background:var(--surface3); border-radius:99px; margin:9px auto 14px; }
  .sheet h3{ margin:0 0 3px; font-size:18px; }
  .sheet .sub{ color:var(--muted); font-size:12.5px; margin-bottom:14px; }
  .sheet h4{ margin:18px 0 8px; font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.6px; }

  .info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:6px; }
  .info-cell{ background:var(--surface2); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:8px 10px; }
  .info-cell.wide{ grid-column:1/-1; }
  .info-cell .k{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .info-cell .v{ font-size:14px; font-weight:600; margin-top:2px; }
  .info-cell .n{ font-size:11.5px; color:var(--text-dim); margin-top:3px; line-height:1.45; font-weight:400; }

  .opt{ display:grid; grid-template-columns:4px minmax(0,1fr) auto auto; align-items:center;
    column-gap:10px; padding:10px 11px; margin-bottom:6px; border-radius:var(--radius-sm);
    background:var(--surface2); border:1px solid var(--line); }
  .opt:active{ background:var(--surface3); }
  .opt.attuale{ border-color:var(--accent-dark); background:var(--accent-soft); }
  .opt .nm{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .opt .sub{ font-size:10.5px; color:var(--muted); margin:0; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .opt .fm{ font-size:14px; font-weight:700; }

  .btn{ width:100%; border:none; border-radius:var(--radius-sm); padding:13px; font-size:14.5px;
    font-weight:700; margin-top:9px; }
  .btn-primary{ background:var(--accent); color:#1a1200; }
  .btn-sec{ background:var(--surface3); color:var(--text); border:1px solid var(--line-2); }
  .btn-danger{ background:rgba(240,99,95,.16); color:#F5928F; border:1px solid rgba(240,99,95,.35); }
  .btn-row{ display:flex; gap:9px; }
  .btn-row .btn{ flex:1; }

  .seg{ display:flex; gap:6px; margin:6px 0 4px; }
  .seg button{ flex:1; background:var(--surface2); border:1px solid var(--line); color:var(--text-dim);
    border-radius:var(--radius-xs); padding:9px 3px; font-size:12px; font-weight:600; }
  .seg button.on{ background:var(--accent-soft); border-color:var(--accent-dark); color:var(--accent); }

  textarea{ width:100%; min-height:110px; background:var(--bg); color:var(--text);
    border:1px solid var(--line-2); border-radius:var(--radius-sm); padding:10px;
    font-family:var(--mono); font-size:11.5px; resize:vertical; }
  input[type=text]{ width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line-2);
    border-radius:var(--radius-sm); padding:11px; font-size:14px; font-family:inherit; }

  .empty{ text-align:center; color:var(--muted); padding:48px 26px; font-size:13.5px; line-height:1.6; }
  .empty b{ color:var(--text-dim); display:block; margin-bottom:7px; font-size:15px; }

  .note{ font-size:11.5px; color:var(--muted); line-height:1.55; margin:8px 0 0; }

  #toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(70px);
    background:var(--surface3); color:var(--text); border:1px solid var(--line-2);
    padding:11px 17px; border-radius:99px; font-size:13px; z-index:60; opacity:0;
    transition:all .24s var(--ease); pointer-events:none; box-shadow:var(--lift-2); }
  #toast.on{ transform:translateX(-50%); opacity:1; }

  /* Su schermi larghi i riquadri da 78px lasciavano il campo quasi vuoto: la riga dei
     difensori ne riempiva il 45%. Crescono con lo spazio, cosi il campo somiglia a un campo
     e i bersagli da toccare restano comodi. */
  @media (min-width:560px){
    .slot{ max-width:112px; padding:8px 6px 7px; }
    .slot .nm{ font-size:13px; } .slot .sq{ font-size:10.5px; } .slot .fm{ font-size:14.5px; }
    .pitch-line{ gap:10px; margin-bottom:12px; }
    .pitch{ padding:18px 10px 16px; }
  }
  @media (min-width:820px){
    .slot{ max-width:138px; padding:10px 8px 8px; }
    .slot .nm{ font-size:14px; } .slot .fm{ font-size:16px; }
    .pitch-line{ gap:14px; margin-bottom:14px; }
  }

  /* Su tablet la lista a tutta larghezza sparpaglia i numeri agli antipodi dello schermo. */
  @media (min-width:820px){
    .tabs, .status-strip, .pitch, .kpis, .prow, .modulo-row, .sec-title, .warnbar{
      max-width:880px; margin-left:auto; margin-right:auto; }
    .sheet{ max-width:880px; left:50%; transform:translateX(-50%); border-radius:22px 22px 0 0; }
  }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="status-strip">
      <span class="gg" id="stGiornata">—</span>
      <span class="eta" id="stEta"></span>
      <span class="sp"></span>
      <button class="icon-btn" id="btnRicarica">Aggiorna</button>
      <button class="icon-btn" id="btnSettings">⚙</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-vista="campo">Campo</button>
      <button class="tab" data-vista="rosa">Rosa</button>
      <button class="tab" data-vista="moduli">Moduli</button>
    </div>
    <div class="warnbar" id="warnbar" style="display:none"></div>
  </header>
  <main id="main"></main>
</div>

<div id="toast"></div>
<div id="overlay"></div>
<div class="sheet" id="sheet"></div>

"pz":"","pr":3},{"id":7363,"n":"Siviero","s":"Torino","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":4},{"id":543,"n":"Padelli","s":"Udinese","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":2},{"id":5707,"n":"Piana","s":"Udinese","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":3},{"id":6671,"n":"Grandi","s":"Venezia","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":2},{"id":7531,"n":"Pozzi","s":"Venezia","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":3},{"id":2127,"n":"Satalino","s":"Sassuolo","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":4},{"id":7557,"n":"Penev","s":"Lecce","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":2},{"id":7560,"n":"Pisseri","s":"Frosinone","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":4},{"id":3,"n":"Radunovic","s":"Cagliari","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":3},{"id":4957,"n":"Montipò","s":"Venezia","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":4},{"id":4468,"n":"Bleve","s":"Lecce","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":3},{"id":7603,"n":"Grabara","s":"Juventus","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":3},{"id":7611,"n":"Mrozek","s":"Udinese","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":4},{"id":2874,"n":"Ghidotti","s":"Parma","r":"P","q":1,"f":1,"fp":0,"t":null,"sc":0,"z":null,"zt":null,"pz":"","pr":3}]</script>

<script>
(function(){
'use strict';

/* =======================================================================================
   COSTANTI DI LEGA
   Tutte qui in testa perche' il regolamento non e' ancora stato verificato: quando
   arrivera', si cambiano questi numeri e non si tocca altro.
   ======================================================================================= */

const MODULI = {
  '3-4-3':{D:3,C:4,A:3}, '3-5-2':{D:3,C:5,A:2},
  '4-3-3':{D:4,C:3,A:3}, '4-4-2':{D:4,C:4,A:2}, '4-5-1':{D:4,C:5,A:1},
  '5-3-2':{D:5,C:3,A:2}, '5-4-1':{D:5,C:4,A:1}
};
const SLOT_MAX = {P:3, D:8, C:8, A:6};
const ROLE_ORDER = ['P','D','C','A'];
const ROLE_NOME = {P:'Portiere', D:'Difensore', C:'Centrocampista', A:'Attaccante'};
const MAX_CAMBI = 3;              // cambi che entrano dalla panchina, da regolamento

/* Il modificatore di difesa e' una MEDIA su portiere + 3 migliori difensori. Le soglie di
   conversione in punti cambiano da lega a lega e per la nostra NON sono state verificate.
   Qui si usa una conversione lineare prudente solo per poter CONFRONTARE i moduli tra loro;
   il valore assoluto non viene mai mostrato come se fosse un punteggio certo. */
const MOD_RIF = 6.00;             // media attorno a cui il modificatore non da' ne toglie
const MOD_PESO = 4.0;             // fantapunti per ogni punto pieno di media sopra il riferimento

/* =======================================================================================
   MODELLO 1 — MEDIA VOTO DI SQUADRA
   Ripreso dall'app asta senza modifiche concettuali: meta' rango e meta' valore
   normalizzato. Il solo rango spaziava le squadre in modo uniforme, il solo valore
   schiacciava la meta' classifica.
   ======================================================================================= */

const MV_MIN = 5.75, MV_MAX = 6.15, MV_AGG_MAX = 0.12;
let MV_SQUADRA = {};

/* Correzione posizionale: il modificatore conta il VOTO, non i bonus, quindi la quotazione
   di un esterno e' gonfiata da gol e assist che al modificatore non servono. */
const MV_ZONA = {
  'Centrale':{off:+0.04, smorza:1.0}, 'Braccetto':{off:+0.03, smorza:1.0},
  'Esterno':{off:-0.05, smorza:0.6},
  'Terzino sx':{off:-0.04, smorza:0.7}, 'Terzino dx':{off:-0.04, smorza:0.7}
};

function calcolaMvSquadre(){
  const idx = {}, squadre = [];
  LISTONE.forEach(p=>{ if(squadre.indexOf(p.s)===-1) squadre.push(p.s); });
  squadre.forEach(sq=>{
    const D = LISTONE.filter(p=>p.s===sq && p.r==='D').sort((a,b)=>b.q-a.q).slice(0,4);
    const G = LISTONE.filter(p=>p.s===sq && p.r==='P').sort((a,b)=>b.q-a.q).slice(0,1);
    const mD = D.length ? D.reduce((s,x)=>s+x.q,0)/D.length : 0;
    const mP = G.length ? G[0].q : 0;
    idx[sq] = 0.25*mP + 0.75*mD;      // stessi pesi del modificatore
  });
  const ord = squadre.slice().sort((a,b)=> idx[a]-idx[b]);
  const vals = squadre.map(sq=>idx[sq]);
  const vmin = Math.min.apply(null,vals), vmax = Math.max.apply(null,vals);
  MV_SQUADRA = {};
  ord.forEach((sq,i)=>{
    const pctRango = ord.length>1 ? i/(ord.length-1) : 0.5;
    const pctValore = (vmax>vmin) ? (idx[sq]-vmin)/(vmax-vmin) : 0.5;
    MV_SQUADRA[sq] = MV_MIN + (MV_MAX-MV_MIN)*(0.5*pctRango + 0.5*pctValore);
  });
}

/* Media voto nelle giornate in cui gioca. Solo P e D: il modificatore riguarda loro. */
function mvStimata(p){
  if(!p || (p.r!=='P' && p.r!=='D')) return null;
  const base = MV_SQUADRA[p.s];
  if(base==null) return null;
  const z = (p.r==='D' && p.z) ? (MV_ZONA[p.z]||null) : null;
  const pari = LISTONE.filter(x=> x.s===p.s && x.r===p.r);
  let agg = 0;
  if(pari.length){
    const media = pari.reduce((s,x)=>s+x.q,0)/pari.length;
    const max = Math.max.apply(null, pari.map(x=>x.q));
    if(max>media) agg = MV_AGG_MAX * Math.max(-1, Math.min(1, (p.q-media)/(max-media)));
  }
  if(z) agg = agg*z.smorza + z.off;
  return Math.max(5.5, Math.min(6.5, base+agg));
}

/* =======================================================================================
   MODELLO 2 — FANTAMEDIA ATTESA
   Quanto rende quando gioca, in fantapunti.

   ATTENZIONE, LIMITE DICHIARATO: i bonus sono STIMATI dal percentile di valore dentro il
   ruolo, non misurati su gol e assist reali. Servono a ordinare due attaccanti tra loro,
   non a prevedere il fantavoto di domenica. Dalla Fase 3, con i voti veri, questa stima
   verra' sostituita progressivamente dai dati.
   ======================================================================================= */

/* Bonus massimo per ruolo, in fantapunti a partita, per chi sta al vertice del suo ruolo.
   Tarati su fantamedie stagionali reali: un attaccante da 7.4 di fantamedia e' un top
   assoluto, uno da 6.4 e' un buon titolare. */
const BONUS_MAX = {P:0.10, D:0.35, C:0.85, A:1.20};
const BONUS_CURVA = 1.7;          // convessa: solo i primi fanno davvero bonus

/* Rigori e piazzati. Un rigorista designato calcia ~0.2 rigori a partita: su 38 giornate
   e' il singolo dato piu' sottovalutato del listone. */
const BONUS_PIAZZATI = {R1:0.40, R2:0.12, R3:0.04, P1:0.10, P2:0.05, P3:0.02};
const MALUS_FISSO = 0.10;         // ammonizioni e simili, forfettario

/* Gol subiti attesi dal portiere, dedotti dalla forza difensiva della squadra. Nel
   fantacalcio classico ogni gol subito vale -1, ed e' il motivo per cui la fantamedia di
   un portiere sta sotto quella di ogni altro ruolo. */
function golSubitiAttesi(sq){
  const b = MV_SQUADRA[sq];
  if(b==null) return 1.35;
  const t = (b - MV_MIN)/(MV_MAX - MV_MIN);      // 0 = difesa peggiore, 1 = migliore
  return 1.75 - 0.85*t;
}

function fantamediaAttesa(p){
  if(!p) return null;
  let voto;
  if(p.r==='P' || p.r==='D'){
    voto = mvStimata(p);
  }else{
    /* Per C e A il voto base conta poco: quello che sposta e' il bonus. Si parte da 6 con
       un piccolo aggiustamento per la forza della squadra. */
    const b = MV_SQUADRA[p.s];
    voto = 6.0 + (b==null ? 0 : (b - 5.95)*0.5);
  }
  if(voto==null) voto = 6.0;

  const pct = (p.fp==null ? 50 : p.fp)/100;
  let bonus = BONUS_MAX[p.r] * Math.pow(Math.max(0,Math.min(1,pct)), BONUS_CURVA);

  const pz = p.pz || '';
  for(const k in BONUS_PIAZZATI){ if(pz.indexOf(k)!==-1) bonus += BONUS_PIAZZATI[k]; }

  let fm = voto + bonus - MALUS_FISSO;
  if(p.r==='P') fm -= golSubitiAttesi(p.s);
  return fm;
}

/* =======================================================================================
   MODELLO 3 — CERTEZZA DI PRENDERE VOTO
   Separata dalla resa di proposito: sono due domande diverse, e mescolarle in un numero
   solo nasconde il caso peggiore (il fortissimo che pero' non gioca).
   ======================================================================================= */

/* Chi non parte titolare puo comunque entrare e prendere voto. Si applica SOLO a chi non e
   dato titolare: per un titolare al 90% sommare la coda del subentro non cambia la sostanza
   e appiattisce la lettura (diventavano tutti 91%, indistinguibili). Per una riserva, invece,
   la coda pesa: entrare a mezzora dalla fine e prendere voto capita spesso. */
const SUBENTRO = 0.18;

function datiGiornata(id){
  if(!PROB) return {prob:null, ind:null, squadraInCampo:false};
  const l = LIS[id];
  return {
    prob: PROB.giocatori[id] || null,
    ind: PROB.indisponibili[id] || null,
    squadraInCampo: !!(l && PROB.squadre[l.s])
  };
}

function certezza(id){
  const ov = S.override[id];
  if(ov!=null) return ov;                       // il giudizio dell'utente vince sempre
  const l = LIS[id];
  if(!l) return 0;
  const d = datiGiornata(id);

  if(d.ind && d.ind.tipo==='squalificato') return 0;

  let p;
  if(!PROB || !d.squadraInCampo){
    /* Nessun dato di giornata, oppure la sua squadra non compare in questo turno (rinvio, o
       scarico parziale). Si ripiega sulla titolarita' fotografata all'asta, ma con un tetto:
       senza il dato di giornata non si puo affermare che uno scenda in campo di sicuro, e
       lasciarlo salire al 100% lo faceva schierare davanti a chi era davvero confermato. */
    p = Math.min((l.t==null ? 70 : l.t)/100, 0.75);
  }else if(d.prob){
    p = (d.prob.pct==null ? (d.prob.titolare?0.85:0.20) : d.prob.pct/100);
    /* data-status="warn" e' un dubbio dichiarato dalla fonte, ma le riserve ce l'hanno
       tutte per definizione: vale come segnale solo sui titolari. */
    if(d.prob.incerto && d.prob.titolare) p *= 0.85;
  }else{
    /* La sua squadra gioca ma lui non e' tra i 24 convocabili elencati. Non e' un buco nei
       dati: e' l'informazione che non giochera'. */
    p = 0.02;
  }

  /* La coda del subentro va applicata PRIMA dei tetti, e solo a chi risulta comunque
     convocato. Applicandola dopo, come faceva la versione precedente, un infortunato risaliva
     da 0.12 a 0.196 e uno fuori dai convocati da 0.02 a 0.196: i due tetti non tenevano piu
     nulla, e tutti e 42 gli infortunati della giornata uscivano identici al 19,6%. */
  if(d.prob && !d.prob.titolare) p = p + SUBENTRO*(1-p);

  /* Questi sono tetti, non sconti: vengono per ultimi e nessuno li deve poter risalire. */
  if(d.ind && d.ind.tipo==='dubbio') p *= 0.65;
  if(d.ind && d.ind.tipo==='infortunato') p = Math.min(p, 0.12);
  return Math.max(0, Math.min(1, p));
}

/* =======================================================================================
   OTTIMIZZATORE
   Sceglie l'undici in modo deterministico (piu' leggibile e stabile a ogni ridisegno), poi
   ne misura il valore con una simulazione. La simulazione serve perche' il modificatore di
   difesa non e' additivo: dipende da CHI dei difensori scende davvero in campo, ed e' l'unico
   modo onesto di dare un prezzo al quarto e quinto difensore, che non alzano la media ma
   fanno da assicurazione.
   ======================================================================================= */

const N_SIM = 1500;

/* Valore atteso di un giocatore per la formazione.

   ATTENZIONE, QUI C'ERA UN BUG GRAVE. La versione precedente sottraeva 6.0 come "voto di
   riferimento": certezza * (fantamedia - 6). Sembra innocuo, ma per chi ha fantamedia SOTTO 6
   il fattore diventa negativo, e moltiplicarlo per una certezza piu alta lo rende PIU negativo.
   Risultato: fra due giocatori l'app preferiva quello che aveva meno probabilita di giocare.

   Colpiva tutti i portieri (nessuno arriva a 6, perche la fantamedia include i gol subiti) e
   piu di meta dei difensori. Con Svilar, Sportiello e Radunovic in rosa, mandava in campo
   Sportiello — dato al 5% dalle probabili — e lasciava Svilar ultimo in panchina.

   Il criterio giusto discende da come funziona simula(): chi non prende voto e non ha un
   sostituto vale ZERO, non 6. Quindi il valore atteso e semplicemente certezza * fantamedia. */
function contributoAtteso(id){
  const l = LIS[id];
  const fm = fantamediaAttesa(l);
  return fm == null ? 0 : certezza(id) * fm;
}

function scegliUndici(modulo){
  const need = Object.assign({P:1}, MODULI[modulo]);
  const titolari = [], panchina = [];
  const bloccatiSet = {};
  ROLE_ORDER.forEach(r=> bloccatiSet[r] = []);

  /* Le caselle fissate a mano vengono servite per prime: se l'utente ha deciso, l'app non
     ridiscute. */
  S.rosa.forEach(id=>{ if(S.bloccati[id]){ const l=LIS[id]; if(l) bloccatiSet[l.r].push(id); } });

  ROLE_ORDER.forEach(r=>{
    const tutti = S.rosa.filter(id=> LIS[id] && LIS[id].r===r);
    /* Se l'utente ne fissa piu di quanti ne preveda il modulo, i posti vanno ai migliori e non
       a chi capita per primo nell'ordine di inserimento in rosa: altrimenti la stessa rosa con
       gli stessi fissaggi dava formazioni diverse a seconda di come era stata composta. */
    const fissi = bloccatiSet[r].slice()
                    .sort((a,b)=> contributoAtteso(b)-contributoAtteso(a))
                    .slice(0, need[r]);
    const resto = tutti.filter(id=> fissi.indexOf(id)===-1)
                       .sort((a,b)=> contributoAtteso(b)-contributoAtteso(a));
    const scelti = fissi.concat(resto.slice(0, Math.max(0, need[r]-fissi.length)));
    titolari.push.apply(titolari, scelti);
    /* La panchina si ordina per resa PER certezza: un riserva bravo che a sua volta non
       gioca non ti salva, ed e' l'errore classico dell'ordinamento per sola qualita'. */
    panchina.push.apply(panchina, resto.slice(Math.max(0, need[r]-fissi.length)));
  });

  /* La panchina non si ordina per bravura, e nemmeno solo per "bravura per probabilita di
     giocare": un riserva entra solo se in campo manca qualcuno DEL SUO RUOLO. Un secondo
     portiere dietro a un titolare dato al 90% e quasi inutile; lo stesso portiere dietro a un
     titolare in dubbio al 40% diventa la prima cosa da mettere in panchina.

     Quindi si pesa anche la probabilita che in quel ruolo serva davvero un cambio, cioe che
     almeno un titolare di quel ruolo resti senza voto. Con i cambi che si scorrono in ordine
     di panchina (vedi simula), questo e cio che decide se il sostituto entrera mai. */
  const serveCambio = {};
  ROLE_ORDER.forEach(r=>{
    const tit = titolari.filter(id=> LIS[id] && LIS[id].r===r);
    let nessunoManca = 1;
    tit.forEach(id=> { nessunoManca *= certezza(id); });
    serveCambio[r] = 1 - nessunoManca;
  });
  panchina.sort((a,b)=>
    contributoAtteso(b)*serveCambio[LIS[b].r] - contributoAtteso(a)*serveCambio[LIS[a].r]);

  return {titolari, panchina};
}

/* Una singola giornata simulata: chi gioca, chi entra al posto di chi, che modificatore esce. */
function simula(titolari, panchina){
  const gioca = {};
  const tuttiId = titolari.concat(panchina);
  tuttiId.forEach(id=>{ gioca[id] = Math.random() < certezza(id); });

  const inCampo = [];
  const daSostituire = [];
  titolari.forEach(id=>{ (gioca[id] ? inCampo : daSostituire).push(id); });

  /* I cambi si scorrono dalla PANCHINA nell'ordine in cui e stata messa, non dai titolari
     mancanti: e cosi che funziona il regolamento, ed e anche l'ordine che l'app stampa nel
     testo da ricopiare sul sito della lega. La versione precedente scorreva i mancanti in
     ordine P->D->C->A, e quando i mancanti erano piu di tre assegnava i cambi a giocatori
     diversi da quelli che sarebbero entrati davvero. */
  let cambi = 0;
  const buchiPerRuolo = {};
  for(const id of daSostituire){ const r = LIS[id].r; buchiPerRuolo[r] = (buchiPerRuolo[r]||0) + 1; }
  for(const sost of panchina){
    if(cambi >= MAX_CAMBI) break;
    const r = LIS[sost].r;
    if(!buchiPerRuolo[r]) continue;        // in quel ruolo non manca nessuno
    if(!gioca[sost]) continue;             // un sostituto senza voto non consuma il cambio
    buchiPerRuolo[r]--; inCampo.push(sost); cambi++;
  }

  let punti = 0;
  const mvP = [], mvD = [];
  for(const id of inCampo){
    const l = LIS[id];
    punti += fantamediaAttesa(l);
    if(l.r==='P'){ const v=mvStimata(l); if(v!=null) mvP.push(v); }
    if(l.r==='D'){ const v=mvStimata(l); if(v!=null) mvD.push(v); }
  }
  /* Chi resta senza voto e senza sostituto vale 0: e' il buco che il quarto difensore evita. */

  mvD.sort((a,b)=> b-a);
  let mod = null;
  if(mvP.length && mvD.length >= 3){
    mod = (mvP[0] + mvD[0] + mvD[1] + mvD[2]) / 4;
    punti += (mod - MOD_RIF) * MOD_PESO;
  }
  return {punti, mod, buchi: 11 - inCampo.length};
}

function valuta(titolari, panchina){
  let sp = 0, sm = 0, nm = 0, sb = 0;
  for(let i=0;i<N_SIM;i++){
    const r = simula(titolari, panchina);
    sp += r.punti; sb += r.buchi;
    if(r.mod!=null){ sm += r.mod; nm++; }
  }
  return {
    punti: sp/N_SIM,
    modificatore: nm ? sm/nm : null,
    probModificatore: nm/N_SIM,
    buchiAttesi: sb/N_SIM
  };
}

function classificaModuli(){
  return Object.keys(MODULI).map(m=>{
    const u = scegliUndici(m);
    const v = valuta(u.titolari, u.panchina);
    return Object.assign({modulo:m}, u, v);
  }).sort((a,b)=> b.punti - a.punti);
}

/* Storico dei voti realmente presi, giornata per giornata: id -> [{giornata, voto, fantavoto,

const CACHE_PROB = 'fantaFormazione_probabili';
const CACHE_STORICO = 'fantaFormazione_storico';

/* Un file di giornata mutilato non deve poter entrare in circolo. Il resto del codice
   dereferenzia sempre `squadre`, `giocatori` e `indisponibili`: se ne manca uno l'app va in
   pagina bianca al primo calcolo, senza un messaggio. Meglio rifiutarlo e comportarsi come
   se non ci fossero dati, che e una situazione gia gestita e dichiarata all'utente. */
function probabiliValide(d){
  return !!(d && d.schema===1
    && d.giocatori && typeof d.giocatori === 'object'
    && d.squadre && typeof d.squadre === 'object'
    && d.indisponibili && typeof d.indisponibili === 'object'
    && Object.keys(d.giocatori).length > 0);
}

async function caricaProbabili(forza){
  /* Prima la copia in memoria locale: l'app deve aprirsi anche in aereo. Poi si prova la
     rete, e se va meglio si aggiorna. La copia in cache va validata come quella di rete —
     anzi di piu: e proprio quella che viene usata quando non c'e modo di riscaricare. */
  if(!forza){
    try{
      const raw = localStorage.getItem(CACHE_PROB);
      if(raw){
        const c = JSON.parse(raw);
        if(probabiliValide(c)) PROB = c;
        else localStorage.removeItem(CACHE_PROB);   // rotta: meglio nessun dato che dati finti
      }
    }catch(e){ try{ localStorage.removeItem(CACHE_PROB); }catch(e2){} }
  }
  try{
    const r = await fetch('./dati/probabili.json', {cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    if(probabiliValide(d)){
      PROB = d;
      try{ localStorage.setItem(CACHE_PROB, JSON.stringify(d)); }catch(e){}
      return true;
    }
    throw new Error('file di giornata non valido');
  }catch(e){
    /* Aperta da file:// il fetch fallisce sempre: non e' un errore da mostrare come tale. */
    return false;
  }
}

/* Oltre questa soglia i dati non sono piu una fotografia della giornata in corso: le
   probabili si rifanno ogni settimana, e una lista vecchia di quattro giorni puo dare
   titolare uno che nel frattempo e squalificato. Va detto forte, non lasciato dedurre
   dalla scritta piccola in alto. */
const ORE_DATI_VECCHI = 96;

function oreDati(){
  if(!PROB || !PROB.generato) return null;
  return (Date.now() - new Date(PROB.generato).getTime())/3600000;
}

/* Scarica i voti delle giornate gia giocate. Non c'e un indice dei file: si prova a
   scendere dalla giornata corrente e ci si ferma al primo che manca. Le giornate sono al
   massimo 38 e i file stanno nella cache del service worker, quindi il costo e trascurabile
   e funziona anche senza rete. */
async function caricaStorico(){
  try{
    const raw = localStorage.getItem(CACHE_STORICO);
    if(raw) STORICO = JSON.parse(raw) || {};
  }catch(e){ STORICO = {}; }

  const ultima = (PROB && PROB.giornata) ? PROB.giornata - 1 : 0;
  if(ultima < 1) return;

  const nuovo = {};
  let trovate = 0;
  for(let g = 1; g <= ultima; g++){
    try{
      const r = await fetch('./dati/voti-' + g + '.json', {cache:'no-cache'});
      if(!r.ok) continue;
      const d = await r.json();
      if(!d || d.schema!==1 || !d.giocatori) continue;
      trovate++;
      for(const id in d.giocatori){
        const x = d.giocatori[id];
        (nuovo[id] || (nuovo[id] = [])).push({
          giornata: g, voto: x.voto, fantavoto: x.fantavoto, senzaVoto: !!x.senzaVoto
        });
      }
    }catch(e){ /* giornata non disponibile: si va avanti */ }
  }
  if(trovate){
    STORICO = nuovo;
    try{ localStorage.setItem(CACHE_STORICO, JSON.stringify(nuovo)); }catch(e){}
  }
}

/* Riassunto del rendimento vero di un giocatore. null se non ha mai giocato. */
function rendimento(id){
  const v = STORICO[id];
  if(!v || !v.length) return null;
  const conVoto = v.filter(x=> x.fantavoto != null);
  if(!conVoto.length) return {presenze:0, senzaVoto:v.length, media:null, elenco:v};
  return {
    presenze: conVoto.length,
    senzaVoto: v.length - conVoto.length,
    media: conVoto.reduce((s,x)=> s+x.fantavoto, 0)/conVoto.length,
    elenco: v
  };
}

function etaDati(){
  const h = oreDati();
  if(h==null) return null;
  if(h < 1) return 'aggiornati poco fa';
  if(h < 24) return 'aggiornati ' + Math.round(h) + ' ore fa';
  const g = Math.round(h/24);
  return 'aggiornati ' + g + (g===1?' giorno fa':' giorni fa');
}

const el = (s)=> document.querySelector(s);
const esc = (s)=> String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = el('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.classList.remove('on'), 2100);
}

function classeCz(c){ return c>=0.7 ? '' : (c>=0.4 ? 'mid' : 'low'); }
function classePct(c){ return c>=0.7 ? 'alta' : (c>=0.4 ? 'media' : (c>0.05 ? 'bassa' : 'out')); }

function flagHtml(id){
  const d = datiGiornata(id);
  let h = '';
  if(S.override[id]!=null) h += '<span class="flag man">a mano</span>';
  if(d.ind){
    const t = d.ind.tipo;
    h += '<span class="flag '+(t==='squalificato'?'sq':(t==='infortunato'?'inf':'dub'))+'">'+
         (t==='squalificato'?'SQUAL.':(t==='infortunato'?'INF.':'DUBBIO'))+'</span>';
  }
  return h;
}

/* "vs ATALANTA" non ci sta in una casella del campo. Si abbrevia a tre lettere, con la @ per
   la trasferta: "@ATA" si legge a colpo d'occhio e occupa quanto il nome della squadra. */
function avversarioBreve(l){
  if(!PROB || !PROB.squadre[l.s]) return l.s;
  const sq = PROB.squadre[l.s];
  if(!sq.avversario) return l.s;
  return (sq.inCasa ? '' : '@') + sq.avversario.slice(0,3).toUpperCase();
}

function slotHtml(id, ruolo){
  if(id==null){
    return '<div class="slot vuoto '+ruolo+'"><div class="nm">—</div><div class="sq">manca</div></div>';
  }
  const l = LIS[id], c = certezza(id), fm = fantamediaAttesa(l);
  const cls = 'slot ' + l.r + (c<0.4?' rischio':'') + (S.bloccati[id]?' bloccato':'');
  return '<div class="'+cls+'" data-slot="'+id+'">' +
    '<div class="nm">'+esc(l.n)+'</div>' +
    /* Sul campo si mostra CONTRO CHI gioca, non la sua squadra: la squadra la sai gia, e
       l'avversario e l'informazione che ti fa decidere se schierarlo. Fuori casa si segna
       con la @, che in una casella da 80px costa un carattere invece di sei. */
    '<div class="sq">'+esc(avversarioBreve(l))+'</div>' +
    '<div class="fm">'+fm.toFixed(2)+'</div>' +
    '<div class="cz-bar '+classeCz(c)+'"><i style="width:'+Math.round(c*100)+'%"></i></div>' +
    '<div class="cz">'+Math.round(c*100)+'%</div>' +
  '</div>';
}

function vistaCampo(){
  if(!S.rosa.length) return vistaVuota();

  const u = scegliUndici(S.modulo);
  const v = valuta(u.titolari, u.panchina);
  const need = Object.assign({P:1}, MODULI[S.modulo]);

  const perRuolo = {};
  ROLE_ORDER.forEach(r=> perRuolo[r] = u.titolari.filter(id=> LIS[id].r===r));

  let h = '';

  /* Il campo si legge dall'attacco in giu': e' l'ordine con cui si guarda una formazione. */
  h += '<div class="pitch">';
  ['A','C','D','P'].forEach(r=>{
    const lista = perRuolo[r];
    h += '<div class="pitch-line">';
    for(let i=0;i<need[r];i++) h += slotHtml(lista[i]!=null ? lista[i] : null, r);
    h += '</div>';
  });
  h += '</div>';

  const mod = v.modificatore;
  /* Un modificatore alto che pero salta spesso non e un modificatore alto: se i difensori
     schierati rischiano di restare senza voto, il blocco non si forma nemmeno. Dire 'forte'
     in quel caso sarebbe rassicurare sul numero sbagliato. */
  const fragile = v.probModificatore < 0.80;
  let giudizio, modCls;
  if(mod==null){ giudizio = '—'; modCls = ''; }
  else if(fragile){
    giudizio = 'salta ' + Math.round((1-v.probModificatore)*100) + '% delle volte';
    modCls = 'debole';
  }else{
    giudizio = (mod>=6.10?'forte':(mod>=5.98?'discreto':(mod>=5.88?'nella media':'debole')))
      + (v.probModificatore<0.97 ? ' · si applica '+Math.round(v.probModificatore*100)+'%' : '');
    modCls = mod>=6.10?'forte':(mod>=5.98?'ok':'debole');
  }
  const dubbi = u.titolari.filter(id=> certezza(id) < 0.6).length;

  h += '<div class="kpis">' +
    '<div class="kpi"><div class="k">Modulo</div><div class="v">'+S.modulo+'</div>' +
      '<div class="s">'+u.titolari.length+' su 11</div></div>' +
    '<div class="kpi"><div class="k">Modificatore</div><div class="v '+modCls+'">'+(mod==null?'—':mod.toFixed(2))+'</div>' +
      '<div class="s">'+giudizio+'</div></div>' +
    '<div class="kpi"><div class="k">Da verificare</div><div class="v '+(dubbi?'ok':'forte')+'">'+dubbi+'</div>' +
      '<div class="s">'+(dubbi===1?'giocatore':'giocatori')+'</div></div>' +
  '</div>';

  h += '<div class="sec-title">Panchina · ordine dei cambi</div>';
  if(!u.panchina.length){
    h += '<div class="empty">Nessuno in panchina.</div>';
  }else{
    u.panchina.forEach((id,i)=>{
      const l = LIS[id], c = certezza(id), fm = fantamediaAttesa(l);
      h += '<div class="prow" data-giocatore="'+id+'">' +
        '<div class="rolebar '+l.r+'"></div>' +
        '<div class="main"><div class="nm">'+(i+1)+'. '+esc(l.n)+flagHtml(id)+'</div>' +
        '<div class="sub">'+esc(l.s)+' · '+ROLE_NOME[l.r]+'</div></div>' +
        '<span class="pct-badge '+classePct(c)+'">'+Math.round(c*100)+'%</span>' +
        '<div class="nums"><div class="fm">'+fm.toFixed(2)+'</div></div>' +
      '</div>';
    });
  }

  h += '<p class="note" style="margin:14px 12px 0">' +
    'Il numero grande e la fantamedia attesa quando gioca; la percentuale e la probabilita che prenda voto. ' +
    'Sono tenute separate apposta: un fuoriclasse al 20% non e un fuoriclasse, quella domenica.</p>';

  return h;
}

function vistaRosa(){
  if(!S.rosa.length) return vistaVuota();
  let h = '';
  ROLE_ORDER.forEach(r=>{
    const lista = S.rosa.filter(id=> LIS[id] && LIS[id].r===r)
                        .sort((a,b)=> contributoAtteso(b)-contributoAtteso(a));
    if(!lista.length) return;
    h += '<div class="sec-title">'+ROLE_NOME[r]+' · '+lista.length+'/'+SLOT_MAX[r]+'</div>';
    /* La fantamedia di un portiere e bassa perche include i gol subiti (-1 ciascuno): senza
       dirlo sembra un errore di calcolo, e invece e come funziona il punteggio. */
    if(r==='P') h += '<p class="note" style="margin:-2px 12px 8px">Nei portieri la fantamedia e piu bassa perche conta i gol subiti.</p>';
    lista.forEach(id=>{
      const l = LIS[id], c = certezza(id), fm = fantamediaAttesa(l);
      const d = datiGiornata(id);
      let dove = '';
      if(PROB && d.squadraInCampo){
        const sq = PROB.squadre[l.s];
        dove = (sq.inCasa?'vs ':'a ') + sq.avversario;
      }else if(PROB){ dove = 'non in questa giornata'; }
      h += '<div class="prow '+(c<0.15?'fuori':'')+'" data-giocatore="'+id+'">' +
        '<div class="rolebar '+l.r+'"></div>' +
        '<div class="main"><div class="nm">'+esc(l.n)+flagHtml(id)+'</div>' +
        '<div class="sub">'+esc(l.s)+(dove?' · '+esc(dove):'')+'</div></div>' +
        '<span class="pct-badge '+classePct(c)+'">'+Math.round(c*100)+'%</span>' +
        '<div class="nums"><div class="fm">'+fm.toFixed(2)+'</div><div class="cz">fantamedia</div></div>' +
      '</div>';
    });
  });
  return h;
}

function vistaModuli(){
  if(!S.rosa.length) return vistaVuota();
  const cl = classificaModuli();
  const attuale = cl.find(x=> x.modulo===S.modulo);
  let h = '<div class="sec-title">Quanto rende ogni modulo</div>';

  cl.forEach((x,i)=>{
    const delta = x.punti - attuale.punti;
    const inA = x.titolari.filter(id=> attuale.titolari.indexOf(id)===-1);
    const outA = attuale.titolari.filter(id=> x.titolari.indexOf(id)===-1);
    let diff;
    if(x.modulo===S.modulo){ diff = 'modulo attuale'; }
    else if(!inA.length){ diff = 'stessi undici'; }
    else{
      diff = 'entra ' + inA.map(id=>LIS[id].n).join(', ') +
             (outA.length ? ' · esce ' + outA.map(id=>LIS[id].n).join(', ') : '');
    }
    h += '<div class="modulo-row '+(x.modulo===S.modulo?'on':'')+'" data-modulo="'+x.modulo+'">' +
      '<div class="rank">'+(i+1)+'</div>' +
      '<div><div class="mn">'+x.modulo+'</div><div class="diff">'+esc(diff)+'</div></div>' +
      '<div class="pts">'+(delta>=0?'+':'')+delta.toFixed(2)+
        '<small>'+(x.modificatore==null?'no mod.':'mod. '+x.modificatore.toFixed(2)+
        (x.probModificatore<0.97 ? ' ('+Math.round(x.probModificatore*100)+'%)' : ''))+'</small></div>' +
    '</div>';
  });

  h += '<p class="note" style="margin:14px 12px 0">' +
    'Il numero e la differenza in fantapunti attesi rispetto al modulo che stai usando, su ' + N_SIM +
    ' giornate simulate. La simulazione serve al modificatore di difesa: si calcola sui 3 migliori ' +
    'difensori, quindi il quarto e il quinto non alzano la media ma coprono il buco quando un ' +
    'titolare resta fuori. Un conto fatto a tavolino non lo vedrebbe.</p>' +
    '<p class="note" style="margin:8px 12px 0">Le soglie del modificatore della nostra lega non sono ' +
    'ancora verificate: la conversione in punti e prudente e serve a confrontare i moduli tra loro, ' +
    'non a promettere un punteggio.</p>';
  return h;
}

function vistaVuota(){
  return '<div class="empty"><b>Non c\'e ancora una rosa</b>' +
    'Importa il file esportato dall\'app asta, oppure componi la rosa a mano.' +
    '<div style="max-width:300px;margin:22px auto 0">' +
    '<button class="btn btn-primary" id="btnVuotaImporta">Importa la rosa</button>' +
    '</div></div>';
}

function render(){
  const m = el('#main');
  m.innerHTML = S.vista==='campo' ? vistaCampo() : (S.vista==='rosa' ? vistaRosa() : vistaModuli());
  m.scrollTop = 0;

  el('#stGiornata').textContent = PROB && PROB.giornata ? ('Giornata '+PROB.giornata) : 'Nessun dato';
  el('#stEta').textContent = etaDati() || '';

  const w = el('#warnbar');
  if(!PROB){
    w.style.display = 'block'; w.className = 'warnbar';
    w.textContent = 'Dati di giornata non disponibili: le percentuali vengono dalla titolarita fotografata all asta.';
  }else if(oreDati() > ORE_DATI_VECCHI){
    w.style.display = 'block'; w.className = 'warnbar';
    w.textContent = 'Dati fermi a ' + etaDati().replace('aggiornati ','') + ' (giornata ' + PROB.giornata + '): potrebbero non essere piu quelli buoni.';
  }else if(!S.rosa.length){
    w.style.display = 'none';
  }else{
    const scoperti = S.rosa.filter(id=>{ const d=datiGiornata(id); return !d.prob && !d.ind && d.squadraInCampo; }).length;
    /* Chi ha la squadra fuori dal turno e un caso diverso e piu insidioso: non manca il
       giocatore dai convocati, manca proprio la sua partita. Prima non generava alcun avviso
       e l'app lo schierava come se fosse sicuro. */
    const fuoriTurno = S.rosa.filter(id=>{ const d=datiGiornata(id); return !d.squadraInCampo; }).length;
    if(fuoriTurno){
      w.style.display='block'; w.className='warnbar';
      w.textContent = fuoriTurno + (fuoriTurno===1?' giocatore ha la squadra' : ' giocatori hanno la squadra') +
        ' fuori da questa giornata: per loro non ci sono dati, controllali a mano.';
    }else if(scoperti){
      w.style.display='block'; w.className='warnbar info';
      w.textContent = scoperti + (scoperti===1?' giocatore non e':' giocatori non sono') + ' tra i convocati di questa giornata.';
    }else{ w.style.display='none'; }
  }

  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('on', t.dataset.vista===S.vista));
}

function schedaGiocatore(id){
  const l = LIS[id], d = datiGiornata(id);
  const c = certezza(id), fm = fantamediaAttesa(l);
  const mv = mvStimata(l);

  let stato = 'Nessun dato di giornata';
  if(d.ind) stato = d.ind.tipo.charAt(0).toUpperCase()+d.ind.tipo.slice(1);
  else if(d.prob) stato = d.prob.titolare ? 'Dato titolare' : 'In panchina';
  else if(d.squadraInCampo) stato = 'Fuori dai convocati';

  let h = '<h3>'+esc(l.n)+'</h3><div class="sub">'+esc(l.s)+' · '+ROLE_NOME[l.r]+
          (S.prezzi[id]?' · pagato '+S.prezzi[id]:'')+'</div>';

  h += '<div class="info-grid">' +
    '<div class="info-cell"><div class="k">Fantamedia attesa</div><div class="v">'+fm.toFixed(2)+'</div>' +
      '<div class="n">quando gioca</div></div>' +
    '<div class="info-cell"><div class="k">Prende voto</div><div class="v">'+Math.round(c*100)+'%</div>' +
      '<div class="n">'+esc(stato)+'</div></div>';

  if(mv!=null){
    h += '<div class="info-cell"><div class="k">Media voto</div><div class="v">'+mv.toFixed(2)+'</div>' +
         '<div class="n">conta per il modificatore</div></div>';
  }
  h += '<div class="info-cell"><div class="k">Quotazione</div><div class="v">'+l.q+'</div>' +
       '<div class="n">'+(l.pz?esc(l.pz):'nessun piazzato')+'</div></div>';

  /* Il rendimento vero accanto alla stima. Lo scarto fra i due si mostra solo da quattro
     giornate in su: su due partite un attaccante che ha segnato una doppietta esce con +8 di
     scarto, e sembrerebbe che il modello sia rotto quando invece e semplicemente varianza.
     Meglio mostrare i numeri e dire che non bastano, che far dedurre una conclusione falsa. */
  const rend = rendimento(id);
  if(rend && rend.media != null){
    const scarto = rend.media - fm;
    const segno = scarto >= 0 ? '+' : '';
    h += '<div class="info-cell wide"><div class="k">Rendimento reale</div>' +
      '<div class="v">' + rend.media.toFixed(2) + ' su ' + rend.presenze +
      (rend.presenze===1 ? ' presenza' : ' presenze') + '</div>' +
      '<div class="n">' + rend.elenco.map(x=>
        'G'+x.giornata+' '+(x.fantavoto==null ? 's.v.' : x.fantavoto.toFixed(1))).join(' · ') +
      (rend.presenze >= 4
        ? ' — rispetto alla stima ' + segno + scarto.toFixed(2)
        : ' — troppe poche giornate per giudicare la stima') + '</div></div>';
  }else if(rend){
    h += '<div class="info-cell wide"><div class="k">Rendimento reale</div>' +
      '<div class="v">mai una valutazione</div>' +
      '<div class="n">' + rend.senzaVoto + ' presenze senza voto</div></div>';
  }

  if(d.ind && d.ind.nota){
    h += '<div class="info-cell wide"><div class="k">Dalla fonte</div><div class="n">'+esc(d.ind.nota)+'</div></div>';
  }
  if(PROB && d.squadraInCampo){
    const sq = PROB.squadre[l.s];
    h += '<div class="info-cell wide"><div class="k">Partita</div>' +
         '<div class="v">'+(sq.inCasa?'in casa con ':'in trasferta a ')+esc(sq.avversario)+'</div>' +
         '<div class="n">'+esc(sq.data||'')+' · modulo '+esc(sq.modulo||'—')+'</div></div>';
  }
  h += '</div>';

  /* Ballottaggi: chi gli contende il posto, con le percentuali della fonte. */
  if(PROB){
    const b = (PROB.ballottaggi||[]).find(g=> g.some(x=> x.id===id));
    if(b){
      h += '<h4>Ballottaggio</h4>';
      b.forEach(x=>{
        h += '<div class="opt '+(x.id===id?'attuale':'')+'">' +
          '<div class="rolebar '+l.r+'"></div>' +
          '<div><div class="nm">'+esc(x.nome)+'</div></div>' +
          '<span class="pct-badge '+classePct((x.pct||0)/100)+'">'+(x.pct==null?'—':x.pct+'%')+'</span>' +
          '<div></div></div>';
      });
    }
  }

  h += '<h4>Correggi a mano</h4>' +
    '<p class="note" style="margin:0 0 8px">Se sai qualcosa che i dati non sanno, decidi tu. ' +
    'La correzione resta anche quando i dati si aggiornano.</p>' +
    '<div class="seg" id="segStato">' +
    '<button data-c="1">Gioca</button><button data-c="0.5">Dubbio</button>' +
    '<button data-c="0">Fuori</button><button data-c="auto">Auto</button></div>';

  const inXI = scegliUndici(S.modulo).titolari.indexOf(id)!==-1;
  h += '<div class="btn-row">' +
    '<button class="btn btn-sec" id="btnBlocca">'+(S.bloccati[id]?'Non fissare':'Fissa in formazione')+'</button>' +
    '</div>';
  if(inXI){
    h += '<button class="btn btn-sec" id="btnCambia">Cambia questo slot</button>';
  }
  h += '<button class="btn btn-sec" id="btnChiudi">Chiudi</button>';

  apriSheet(h);

  const cur = S.override[id];
  document.querySelectorAll('#segStato button').forEach(b=>{
    const val = b.dataset.c;
    const on = (val==='auto') ? cur==null : (cur!=null && Math.abs(cur-parseFloat(val))<0.01);
    b.classList.toggle('on', on);
    b.addEventListener('click', ()=>{
      if(val==='auto') delete S.override[id]; else S.override[id] = parseFloat(val);
      salva(); chiudiSheet(); render();
      toast(val==='auto' ? 'Torna al dato automatico' : 'Corretto a mano');
    });
  });
  el('#btnBlocca').addEventListener('click', ()=>{
    if(S.bloccati[id]) delete S.bloccati[id]; else S.bloccati[id]=true;
    salva(); chiudiSheet(); render();
    toast(S.bloccati[id]?'Fissato in formazione':'Non piu fissato');
  });
  const bc = el('#btnCambia');
  if(bc) bc.addEventListener('click', ()=> alternativePerRuolo(LIS[id].r, id));
  el('#btnChiudi').addEventListener('click', chiudiSheet);
}

function alternativePerRuolo(ruolo, idAttuale){
  const u = scegliUndici(S.modulo);
  const cand = S.rosa.filter(id=> LIS[id] && LIS[id].r===ruolo)
                     .sort((a,b)=> contributoAtteso(b)-contributoAtteso(a));
  let h = '<h3>'+ROLE_NOME[ruolo]+'</h3>' +
    '<div class="sub">Chi scegli viene fissato in formazione, cosi l app non te lo ricambia.</div>';
  cand.forEach(id=>{
    const l = LIS[id], c = certezza(id), fm = fantamediaAttesa(l);
    const inXI = u.titolari.indexOf(id)!==-1;
    h += '<div class="opt '+(inXI?'attuale':'')+'" data-scegli="'+id+'">' +
      '<div class="rolebar '+ruolo+'"></div>' +
      '<div><div class="nm">'+esc(l.n)+'</div><div class="sub">'+esc(l.s)+
        (inXI?' · in campo':'')+'</div></div>' +
      '<span class="pct-badge '+classePct(c)+'">'+Math.round(c*100)+'%</span>' +
      '<div class="fm">'+fm.toFixed(2)+'</div></div>';
  });
  h += '<button class="btn btn-sec" id="btnChiudi2">Chiudi</button>';
  apriSheet(h);

  document.querySelectorAll('[data-scegli]').forEach(n=>{
    n.addEventListener('click', ()=>{
      const nuovo = +n.dataset.scegli;
      /* Fissare il nuovo e liberare il vecchio: altrimenti restano fissati entrambi e uno
         dei due sparisce senza spiegazione. */
      if(idAttuale!=null) delete S.bloccati[idAttuale];
      S.bloccati[nuovo] = true;
      salva(); chiudiSheet(); render(); toast(LIS[nuovo].n + ' in formazione');
    });
  });
  el('#btnChiudi2').addEventListener('click', chiudiSheet);
}

/* =======================================================================================
   IMPOSTAZIONI: import rosa, composizione a mano, formazione da copiare
   ======================================================================================= */

function apriSettings(){
  const n = S.rosa.length;
  let h = '<div class="handle"></div><h3>Impostazioni</h3>' +
    '<div class="sub">'+esc(S.squadraNome)+' · '+n+' giocatori in rosa</div>';

  h += '<h4>Rosa</h4>' +
    '<p class="note" style="margin:0 0 8px">Incolla qui il file esportato dall app asta ' +
    '(Impostazioni → Esporta rosa). Riconosce lo schema 1.</p>' +
    '<textarea id="boxRosa" placeholder="Incolla il JSON della rosa..."></textarea>' +
    '<div class="btn-row"><button class="btn btn-primary" id="btnImporta">Importa</button>' +
    '<button class="btn btn-sec" id="btnComponi">Componi a mano</button></div>';

  h += '<h4>Dati di giornata</h4>' +
    '<p class="note" style="margin:0 0 8px">' +
    (PROB ? ('Giornata '+PROB.giornata+', '+esc(etaDati()||'')+'. Fonte: probabili formazioni di fantacalcio.it.')
          : 'Nessun dato caricato. Se apri l app da file locale il caricamento automatico non funziona: incolla qui il contenuto di dati/probabili.json.') +
    '</p>' +
    '<textarea id="boxProb" placeholder="Incolla qui probabili.json se serve..."></textarea>' +
    '<div class="btn-row"><button class="btn btn-sec" id="btnProbIncolla">Carica incollato</button>' +
    '<button class="btn btn-sec" id="btnProbRete">Riprova dalla rete</button></div>';

  if(n){
    h += '<h4>Formazione da copiare</h4>' +
      '<p class="note" style="margin:0 0 8px">Testo pronto da riportare su Leghe Fantacalcio.</p>' +
      '<textarea id="boxOut" readonly>'+esc(testoFormazione())+'</textarea>' +
      '<button class="btn btn-sec" id="btnCopia">Copia negli appunti</button>';
  }

  h += '<h4>Azzeramenti</h4>' +
    '<button class="btn btn-sec" id="btnResetMano">Togli tutte le correzioni a mano</button>' +
    '<button class="btn btn-danger" id="btnResetTutto">Cancella rosa e ricomincia</button>' +
    '<button class="btn btn-sec" id="btnChiudiSet">Chiudi</button>';

  el('#settingsSheet').innerHTML = h;
  el('#settingsSheet').style.display='block';
  el('#overlay').style.display='block';

  el('#btnImporta').addEventListener('click', ()=> importaRosa(el('#boxRosa').value));
  el('#btnComponi').addEventListener('click', componiRosa);
  el('#btnProbIncolla').addEventListener('click', ()=>{
    try{
      const d = JSON.parse(el('#boxProb').value);
      if(!probabiliValide(d)) throw new Error();
      PROB = d;
      try{ localStorage.setItem(CACHE_PROB, JSON.stringify(d)); }catch(e){}
      chiudiSheet(); render(); toast('Dati di giornata caricati');
    }catch(e){ toast('JSON non valido'); }
  });
  el('#btnProbRete').addEventListener('click', async ()=>{
    const ok = await caricaProbabili(true);
    chiudiSheet(); render();
    toast(ok ? 'Dati aggiornati' : 'Non raggiungibile');
  });
  const bc = el('#btnCopia');
  if(bc) bc.addEventListener('click', ()=>{
    const t = el('#boxOut'); t.select();
    navigator.clipboard.writeText(t.value).then(()=>toast('Copiata')).catch(()=>toast('Copia manualmente'));
  });
  el('#btnResetMano').addEventListener('click', ()=>{
    S.override = {}; S.bloccati = {}; salva(); chiudiSheet(); render(); toast('Correzioni rimosse');
  });
  el('#btnResetTutto').addEventListener('click', ()=>{
    if(!confirm('Cancellare la rosa e tutte le impostazioni?')) return;
    S.rosa=[]; S.prezzi={}; S.bloccati={}; S.override={};
    salva(); chiudiSheet(); render(); toast('Azzerato');
  });
  el('#btnChiudiSet').addEventListener('click', chiudiSheet);
}

function importaRosa(testo){
  let d;
  try{ d = JSON.parse(testo); }catch(e){ toast('Non e un JSON valido'); return; }

  /* Il campo `schema` esiste apposta: se un giorno il formato cambia, ci si accorge invece
     di leggere numeri sbagliati in silenzio. */
  if(!d || d.schema!==1 || !d.mia || !d.mia.rosa){
    toast('Formato non riconosciuto (serve lo schema 1)'); return;
  }

  const rosa = [], prezzi = {}, ignorati = [];
  ROLE_ORDER.forEach(r=>{
    (d.mia.rosa[r]||[]).forEach(g=>{
      if(LIS[g.id]){ rosa.push(g.id); prezzi[g.id] = g.prezzoPagato||0; }
      else ignorati.push(g.nome||g.id);
    });
  });
  if(!rosa.length){ toast('Nessun giocatore riconosciuto'); return; }

  S.rosa = rosa; S.prezzi = prezzi;
  S.squadraNome = d.mia.squadra || S.squadraNome;
  S.bloccati = {}; S.override = {};
  salva(); chiudiSheet(); render();
  toast(rosa.length + ' giocatori importati' + (ignorati.length ? ', '+ignorati.length+' non nel listone' : ''));
}

/* Composizione a mano: serve prima dell'asta per provare l'app, e dopo per il mercato. */
function componiRosa(){
  let filtro = '';
  function disegna(){
    const q = filtro.toLowerCase();
    let h = '<div class="handle"></div><h3>Componi la rosa</h3>' +
      '<div class="sub">'+S.rosa.length+' scelti · P '+cnt('P')+'/3 · D '+cnt('D')+'/8 · C '+cnt('C')+'/8 · A '+cnt('A')+'/6</div>' +
      '<input type="text" id="cerca" placeholder="Cerca un giocatore..." value="'+esc(filtro)+'">';

    const scelti = S.rosa.map(id=>LIS[id]).filter(Boolean);
    if(scelti.length){
      h += '<h4>In rosa</h4>';
      scelti.sort((a,b)=> ROLE_ORDER.indexOf(a.r)-ROLE_ORDER.indexOf(b.r) || b.q-a.q).forEach(l=>{
        h += '<div class="opt" data-togli="'+l.id+'"><div class="rolebar '+l.r+'"></div>' +
          '<div><div class="nm">'+esc(l.n)+'</div><div class="sub">'+esc(l.s)+'</div></div>' +
          '<span class="pct-badge out">togli</span><div></div></div>';
      });
    }

    if(q.length>=2){
      const res = LISTONE.filter(p=> p.n.toLowerCase().indexOf(q)!==-1 && S.rosa.indexOf(p.id)===-1)
                         .sort((a,b)=> b.sc-a.sc).slice(0,25);
      h += '<h4>Risultati</h4>';
      if(!res.length) h += '<p class="note">Nessuno.</p>';
      res.forEach(l=>{
        const pieno = cnt(l.r) >= SLOT_MAX[l.r];
        h += '<div class="opt" data-aggiungi="'+l.id+'" style="'+(pieno?'opacity:.45':'')+'">' +
          '<div class="rolebar '+l.r+'"></div>' +
          '<div><div class="nm">'+esc(l.n)+'</div><div class="sub">'+esc(l.s)+' · qt '+l.q+'</div></div>' +
          '<span class="pct-badge '+(pieno?'out':'alta')+'">'+(pieno?'pieno':'+')+'</span><div></div></div>';
      });
    }else{
      h += '<p class="note" style="margin-top:14px">Scrivi almeno due lettere per cercare.</p>';
    }
    h += '<button class="btn btn-primary" id="btnFineComponi">Fatto</button>';

    el('#settingsSheet').innerHTML = h;
    const c = el('#cerca');
    c.addEventListener('input', ()=>{ filtro = c.value; const p=c.selectionStart; disegna();
      const c2=el('#cerca'); c2.focus(); c2.setSelectionRange(p,p); });
    document.querySelectorAll('[data-aggiungi]').forEach(n=> n.addEventListener('click', ()=>{
      const id = +n.dataset.aggiungi, l = LIS[id];
      if(cnt(l.r) >= SLOT_MAX[l.r]){ toast('Reparto pieno'); return; }
      S.rosa.push(id); salva(); disegna();
    }));
    document.querySelectorAll('[data-togli]').forEach(n=> n.addEventListener('click', ()=>{
      const id = +n.dataset.togli;
      S.rosa = S.rosa.filter(x=> x!==id); delete S.bloccati[id]; delete S.override[id];
      salva(); disegna();
    }));
    el('#btnFineComponi').addEventListener('click', ()=>{ chiudiSheet(); render(); });
  }
  function cnt(r){ return S.rosa.filter(id=> LIS[id] && LIS[id].r===r).length; }
  disegna();
  el('#settingsSheet').style.display='block';
  el('#overlay').style.display='block';
}

function testoFormazione(){
  const u = scegliUndici(S.modulo);
  const nomi = (ids)=> ids.map(id=> LIS[id].n).join(', ');
  let t = S.squadraNome + ' — modulo ' + S.modulo;
  if(PROB && PROB.giornata) t += ' — giornata ' + PROB.giornata;
  t += '\n\nTITOLARI\n';
  ROLE_ORDER.forEach(r=>{
    const l = u.titolari.filter(id=> LIS[id].r===r);
    if(l.length) t += r + ': ' + nomi(l) + '\n';
  });
  t += '\nPANCHINA (in ordine)\n';
  u.panchina.forEach((id,i)=>{ t += (i+1) + '. ' + LIS[id].n + ' (' + LIS[id].r + ')\n'; });
  return t;
}

/* =======================================================================================
   AVVIO
   ======================================================================================= */

document.addEventListener('click', (e)=>{
  const slot = e.target.closest('[data-slot]');
  if(slot){ schedaGiocatore(+slot.dataset.slot); return; }
  const g = e.target.closest('[data-giocatore]');
  if(g){ schedaGiocatore(+g.dataset.giocatore); return; }
  const m = e.target.closest('[data-modulo]');
  if(m){ S.modulo = m.dataset.modulo; salva(); render(); toast('Modulo '+S.modulo); return; }
  if(e.target.id==='btnVuotaImporta'){ apriSettings(); return; }
});

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{ S.vista = t.dataset.vista; render(); });
});
el('#btnSettings').addEventListener('click', apriSettings);
el('#btnRicarica').addEventListener('click', async ()=>{
  const ok = await caricaProbabili(true);
  await caricaStorico();
  render(); toast(ok ? 'Dati aggiornati' : 'Dati non raggiungibili');
});
el('#overlay').addEventListener('click', chiudiSheet);

carica();
calcolaMvSquadre();
caricaProbabili(false)
  .then(()=> { render(); return caricaStorico(); })
  .then(()=> render());
render();

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

})();
</script>
