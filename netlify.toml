# Configurazione del sito.
# Sito statico: nessuna build, si pubblica la cartella cosi com'e.

[build]
  publish = "."
  # Rete di sicurezza sui crediti di build: ogni pubblicazione costa crediti
  # (incidente del 04/09: 150 bruciati con push ripetuti su main).
  #
  # Si pubblica SOLO se, rispetto all'ultima pubblicazione, e' cambiato uno
  # dei file che il sito usa davvero: l'app (index.html, sw.js,
  # manifest.webmanifest — le icone sono dentro il manifest) e la funzione
  # "schierato" con le sue dipendenze (netlify/, package.json,
  # package-lock.json). Tutto il resto non entra nel sito o non serve che ci
  # entri: dati/ (il telefono li legge direttamente da GitHub), tools/ e
  # .github/ (girano solo nella GitHub Action), diario e file di servizio.
  #
  # Prima (fino al 26/09) era un elenco di ESCLUSIONI (dati/, *.md), quindi
  # ogni correzione a uno script o a un workflow — che col sito non c'entra —
  # costava una pubblicazione. Un elenco di inclusioni sbaglia nell'altro
  # verso solo se si aggiunge un file nuovo che il sito usa: in quel caso va
  # aggiunto qui sotto, insieme.
  #
  # Nota: una modifica SOLO a questo file (es. le intestazioni di cache sotto)
  # non pubblica da sola. Va online col primo deploy dell'app, oppure a mano
  # da Netlify (Deploys -> Trigger deploy, che costa crediti come gli altri).
  # Nel dubbio si pubblica, non si salta: se $CACHED_COMMIT_REF manca o e'
  # uguale a $COMMIT_REF (pubblicazione senza cache, o lo stesso commit
  # rilanciato a mano) si pubblica sempre. Senza questa guardia git
  # confrontava il commit con se stesso, non trovava differenze e annullava
  # anche un deploy chiesto a mano (difetto anche della regola precedente,
  # trovato provando il comando il 26/09).
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html sw.js manifest.webmanifest netlify/ package.json package-lock.json"

[functions]
  # netlify/functions/schierato.mjs: l'unica funzione del progetto, ricorda se hai gia
  # schierato la giornata corrente (vedi il file per il perche'). Ha una dipendenza vera
  # (@netlify/blobs, in package.json) - a differenza dell'app e degli scraper, che restano a
  # dipendenze zero apposta - quindi qui serve davvero un passo di build che la installi.
  directory = "netlify/functions"

# ---------------------------------------------------------------------------
# Cache: la parte che conta davvero.
#
# Il problema classico delle PWA e il service worker che resta in cache. Se un
# CDN serve un sw.js vecchio, il browser continua a usare la versione vecchia
# dell'app anche dopo un deploy nuovo, e l'utente non ha modo di accorgersene
# ne di forzare l'aggiornamento: vede un'app che semplicemente non cambia mai.
# Per questo sw.js non va mai messo in cache.
#
# Stesso ragionamento per i dati di giornata: la GitHub Action li riscrive fino
# a cinque volte a settimana, e una copia vecchia servita dal CDN significa
# schierare la formazione su probabili superate. Meglio una richiesta in piu
# che un dato sbagliato.
#
# Il resto (l'app stessa, che e un unico index.html) usa no-cache: il browser
# puo tenerne una copia ma deve sempre chiedere se e cambiata. A rendere l'app
# utilizzabile senza rete ci pensa il service worker, non la cache HTTP.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    # Permette al service worker di controllare tutta la cartella.
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/dati/*"
  [headers.values]
    Cache-Control = "no-cache"
