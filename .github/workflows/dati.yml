name: Aggiorna dati di giornata

# Due lavori distinti, con un ritmo che segue quanto ogni giorno e' utile — non un giro fisso
# uguale tutta la settimana. Leggere piu' spesso costa zero (vedi sotto), quindi il limite non e'
# "quante letture ci possiamo permettere" ma "quando una lettura in piu' puo' davvero dire
# qualcosa di nuovo".
#
# LUNEDI E MARTEDI — servono innanzitutto a raccogliere i VOTI del turno di campionato appena
# concluso (mattina e sera, cosi' si intercettano anche se pubblicati presto). Sono anche i due
# giorni di riserva per un TURNO INFRASETTIMANALE: se le probabili appena scaricate rivelano che
# la prossima giornata comincia lunedi-giovedi invece che nel weekend, la preparazione che di
# norma sta tra mercoledi e venerdi non farebbe in tempo — deve succedere qui.
# `tools/invia-promemoria.mjs` riconosce da solo il turno infrasettimanale (guarda il giorno
# della prima partita) e manda un promemoria diverso, piu' esplicito, invece di aspettare la
# cadenza normale. E il MARTEDI diventa da solo orario, come il venerdi di un turno normale: un
# giro extra (`tools/turno-infrasettimanale.mjs`) controlla prima di tutto se il turno noto in
# quel momento e' infrasettimanale — se non lo e' non tocca nemmeno fantacalcio.it, se lo e'
# funziona esattamente come il giro base. Non serve invece nessun giro extra per il lunedi: se
# un turno comincia lunedi mattina prestissimo il primo avviso utile arriva comunque solo alle
# 09:00 (vedi limite dichiarato in CLAUDE.md), quindi renderlo orario non guadagnerebbe nulla.
#
# DA MERCOLEDI — si passa a preparare la formazione della giornata successiva (weekend normale).
# Mercoledi e giovedi sono ancora "presto": poche notizie vere, ma si comincia a farsi un'idea.
# Il grosso arriva il venerdi (allenamenti, dubbi, ballottaggi che si sciolgono), quindi e' li'
# che si concentra la lettura piu' fitta, un giro all'ora. L'ultimo giro di venerdi e' alle 20:00,
# non piu' tardi: col venerdi sera che spesso ha gia' una partita alle 20:45, un giro dopo il
# fischio d'inizio sarebbe uno sprecato. Orari in UTC (d'estate l'Italia e' UTC+2):
#   lunedi e martedi  09:00 e 21:00 CEST   -> voti del turno concluso, sempre
#   martedi           08:00-20:00 CEST     -> in piu', un giro all'ora ma solo se infrasettimanale
#   mercoledi         09:00 e 15:00 CEST   -> due letture, si comincia a preparare
#   giovedi           08/11/14/17/20 CEST  -> cinque letture nella giornata
#   venerdi           08:00-20:00 CEST     -> un giro all'ora, si ferma prima delle partite serali
#   sabato            09:00 e 12:00 CEST   -> aggiornamenti prima delle partite del pomeriggio
#   domenica          09:00 CEST           -> ultimo giro prima del grosso della giornata
#
# VOTI — hanno senso solo a giornata conclusa. Si prova lunedi e martedi: se la giornata non e
# ancora chiusa lo scraper se ne accorge da solo e non scrive nulla.
#
# PERCHE' COSI' TANTE LETTURE, E PERCHE' NON COSTA NIENTE: il repository e' pubblico, quindi
# GitHub Actions e' gratis e senza limite di minuti (la quota mensile vale solo per repository
# privati). Ogni lettura in piu' e' un piccolo script Node che legge una pagina pubblica e scrive
# un file: nessun costo Netlify, perche' questi dati arrivano al telefono passando direttamente
# da GitHub (vedi *Aggiornamenti e crediti Netlify* in CLAUDE.md), non da una pubblicazione del
# sito. L'unico limite resta la cortesia verso fantacalcio.it: uno User-Agent dichiarato, nessuna
# raffica piu' fitta di una volta all'ora, mai di notte.

on:
  schedule:
    - cron: '0 7,19 * * 1,2'    # lunedi e martedi, 09:00 e 21:00 CEST (voti, sempre)
    - cron: '0 6,8-18 * * 2'    # martedi, giro extra ogni ora — SOLO se il turno e' infrasettimanale
                                 # (l'ora 07 e' gia' coperta dalla riga sopra, per non farle scattare insieme)
    - cron: '0 7,13 * * 3'      # mercoledi, 09:00 e 15:00 CEST
    - cron: '0 6,9,12,15,18 * * 4'   # giovedi, 5 giri (08/11/14/17/20 CEST)
    - cron: '0 6-18 * * 5'      # venerdi, ogni ora dalle 08:00 alle 20:00 CEST
    - cron: '0 7,10 * * 6'      # sabato, invariato
    - cron: '0 7 * * 0'         # domenica, invariato
  workflow_dispatch:
    inputs:
      giornata_voti:
        description: 'Giornata di cui scaricare i voti (vuoto = solo probabili)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dati-giornata
  cancel-in-progress: true

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Solo per il giro extra del martedi (vedi commento in testa al file): legge l'ultimo
      # dati/probabili.json gia' sul disco, quello di PRIMA di questo giro, per decidere se vale
      # la pena controllare fantacalcio.it un'altra volta o se si puo' saltare in silenzio. Per
      # tutti gli altri giri (compreso il martedi base delle 09/21) questo passo non gira nemmeno:
      # "infra" resta vuoto, e la condizione sotto lo legge come "non applicabile", non come "no".
      - name: Turno infrasettimanale? (solo per il giro extra del martedi)
        id: turno
        if: github.event.schedule == '0 6,8-18 * * 2'
        run: echo "infra=$(node tools/turno-infrasettimanale.mjs)" >> "$GITHUB_OUTPUT"

      # Nessuno scraper ha dipendenze: niente npm install, niente lockfile che invecchia.
      # Se la validazione fallisce, lo script esce con codice 1 e il workflow diventa rosso
      # SENZA aver scritto niente: si tiene il file vecchio, sempre meglio di uno rotto.
      #
      # Gate identico su questo passo e sul prossimo: girano sempre, TRANNE al giro extra del
      # martedi quando il turno non e' infrasettimanale — li' non c'e' niente da controllare ne
      # da avvisare, e si salta senza toccare fantacalcio.it.
      - name: Probabili formazioni
        if: github.event.schedule != '0 6,8-18 * * 2' || steps.turno.outputs.infra == 'true'
        run: node "tools/fetch-probabili.mjs"

      # Promemoria push per schierare, un tanto per giornata (vedi tools/invia-promemoria.mjs
      # per come evita di rispedirlo a ogni giro). Se i secret non sono ancora impostati esce
      # subito senza errore: e' un extra sopra lo scraper, non deve poterlo far fallire.
      # web-push non e' installato come dipendenza del repo (niente package.json/lockfile,
      # stessa scelta fatta per gli scraper): si scarica al volo solo qui, solo quando serve.
      - name: Promemoria push (se configurato)
        if: github.event.schedule != '0 6,8-18 * * 2' || steps.turno.outputs.infra == 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          npm install --no-save web-push@3.6.7 --silent
          node "tools/invia-promemoria.mjs"

      # I voti si scaricano solo quando ha senso: ai giri di lunedi e martedi, o quando li si
      # chiede a mano. `continue-on-error` perche una giornata non ancora conclusa fa fallire lo
      # scraper di proposito, e non e un motivo per marcare rosso tutto il workflow.
      #
      # SI RIPROVA OGNI GIORNATA MANCANTE, NON SOLO "l'ultima meno uno". Prima si scaricava solo
      # la giornata immediatamente precedente a quella dichiarata nelle probabili: bastava un
      # turno infrasettimanale infilato in mezzo (due giornate concluse nella stessa settimana,
      # invece della solita una) perche' la piu' vecchia delle due sparisse per sempre — la
      # settimana dopo il conto "meno uno" sarebbe gia' avanzato alla giornata successiva, senza
      # essersi mai accorto del buco. Ora si scorrono tutte le giornate da 1 fino a quella
      # conclusa, e si prova a scaricare solo quelle il cui file manca ancora: economico (un
      # controllo su disco, nessuna richiesta) per le giornate gia' a posto, e recupera da solo
      # anche un giro saltato per un guasto della Action, non solo un turno infrasettimanale.
      - name: Voti delle giornate concluse
        if: github.event.schedule == '0 7,19 * * 1,2' || github.event.inputs.giornata_voti != ''
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.giornata_voti }}" ]; then
            echo "Scarico la giornata ${{ github.event.inputs.giornata_voti }} (richiesta a mano)"
            node "tools/fetch-voti.mjs" "${{ github.event.inputs.giornata_voti }}"
          else
            ULTIMA=$(node -e "const g=require('./dati/probabili.json').giornata; console.log(g>1?g-1:0)")
            for G in $(seq 1 "$ULTIMA" 2>/dev/null || true); do
              if [ ! -f "dati/voti-$G.json" ]; then
                echo "Manca dati/voti-$G.json: provo a scaricarlo"
                node "tools/fetch-voti.mjs" "$G" || true
              fi
            done
          fi
          exit 0

      # L'app che impara dalla stagione: confronta la stima pura con tutti i voti reali
      # scaricati finora e corregge un po' per volta uno scarto sistematico per ruolo, se il
      # campione e' abbastanza grande da fidarsene (vedi tools/ricalibra.mjs per le soglie e
      # perche' sono li'). Stesso gate della Action sopra: ha senso solo quando i voti possono
      # essere appena cambiati.
      - name: Ricalibrazione del modello
        if: github.event.schedule == '0 7,19 * * 1,2' || github.event.inputs.giornata_voti != ''
        run: node "tools/ricalibra.mjs"

      # Gli scraper riscrivono sempre il campo "generato", quindi senza questo passo la Action
      # committerebbe a ogni giro anche quando i dati non sono cambiati: sei commit a settimana
      # di puro rumore, altrettanti deploy, e una storia git in cui diventa impossibile vedere
      # quando i dati sono cambiati per davvero.
      # Se in un file l'unica riga diversa e il timestamp, la modifica viene annullata.
      - name: Scarta i file in cui e cambiato solo il timestamp
        run: |
          for f in $(git diff --name-only -- dati/); do
            cambiate=$(git diff -U0 -- "$f" | grep -c '^[+-][^+-]' || true)
            solotimestamp=$(git diff -U0 -- "$f" | grep '^[+-][^+-]' | grep -c '"generato"' || true)
            if [ "$cambiate" = "2" ] && [ "$solotimestamp" = "2" ]; then
              echo "$f: solo il timestamp, annullo"
              git checkout -- "$f"
            fi
          done

      - name: Committa se e cambiato qualcosa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dati/; then
            echo "Nessuna variazione: niente commit."
            exit 0
          fi
          GIORNATA=$(node -e "console.log(require('./dati/probabili.json').giornata)")
          git add dati/
          git commit -m "Dati giornata ${GIORNATA} — $(date -u '+%d/%m %H:%M UTC')"
          git push
